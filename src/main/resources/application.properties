spring.application.name=careflow-backend

server.port=8080

# Default profile: dev (uses persistent H2 in ./data/careflow with PostgreSQL compatibility mode)
# To run with PostgreSQL: use --spring.profiles.active=postgres or set SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=dev

# JWT Configuration
careflow.jwt.secret=CareFlowDevelopmentSecretKeyChangeThisBeforeProduction12345678901234567890
careflow.jwt.expiration-ms=86400000

# Gemini API Key (Optional AI assistant)
careflow.gemini.api-key=${GEMINI_API_KEY:}